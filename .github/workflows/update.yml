name: Update Formula and Cask

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag
        required: true
        default: nightly
        type: string
  repository_dispatch:
    types: [devicehub-release]

permissions:
  contents: write

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Update release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag || 'nightly' }}
        run: ruby script/update.rb "$RELEASE_TAG"

      - name: Stage generated definitions
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/devicehub-mask-headless.rb Casks/devicehub-mask.rb
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update DeviceHub Mask release"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Homebrew definitions
        run: |
          brew tap boa-z/devicehub-mask "file://${GITHUB_WORKSPACE}"
          brew style boa-z/devicehub-mask/devicehub-mask-headless boa-z/devicehub-mask/devicehub-mask
          brew audit --strict boa-z/devicehub-mask/devicehub-mask-headless
          brew audit --cask boa-z/devicehub-mask/devicehub-mask
          brew fetch boa-z/devicehub-mask/devicehub-mask-headless
          brew fetch --cask boa-z/devicehub-mask/devicehub-mask

      - name: Push update
        if: steps.changes.outputs.changed == 'true'
        run: git push
